name: StudyAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m py_compile audit_monitor.py app.py launcher.py personal_ai.py database.py production_preflight.py migrate_sqlite_to_postgres.py verify_neon_setup.py tests/pre-beta-server.py tests/postgres-migration.py
      - run: python tests/pre-beta-server.py
      - name: Audit review security and reporting tests
        run: python -m unittest discover -s tests -p 'test_audit_monitor.py' -v
      - name: JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done
          node --check tests/learning-integration.cjs
          node --check tests/product-experience.cjs
          node --check tests/pre-beta-smoke.cjs
          node --check tests/cbse-curriculum.cjs
          node --check tests/cbse-browser.cjs
          node --check tests/caie-as-physics.cjs
          node --check tests/caie-browser.cjs
          node --check tests/caie-as-chemistry.cjs
          node --check tests/caie-chemistry-browser.cjs
          node --check tests/caie-as-mathematics.cjs
          node --check tests/caie-mathematics-browser.cjs
          node --check tests/caie-a-level-physics.cjs
          node --check tests/caie-a-level-physics-browser.cjs
          node --check tests/caie-a-level-chemistry.cjs
          node --check tests/caie-a-level-chemistry-browser.cjs
          node --check tests/caie-a-level-mathematics.cjs
          node --check tests/caie-a-level-mathematics-browser.cjs
          node --check tests/content-first-notes-browser.cjs
          node --check tests/course-dashboard-browser.cjs
          node --check tests/cambridge-full-notes-diagrams-browser.cjs
          node --check tests/chapter-navigation-hover-browser.cjs
          node --check tests/class9-math-topic-browser.cjs
          node --check tests/class9-lesson-progress-browser.cjs
          node --check tests/class9-science-checklist-parity-browser.cjs
          node --check cbse-class9-english-kaveri-unit01-full-notes.js
          node --check tests/class9-english-kaveri-unit01-browser.cjs
          node --check tests/class9-audited-depth-merged-browser.cjs
          node --check tests/class9-ch01-ncert-final-browser.cjs
          node --check tests/class9-ch02-ncert-final-browser.cjs
          node --check tests/class9-ch03-ncert-final-browser.cjs
          node --check tests/class9-ch04-ncert-final-browser.cjs
          node --check tests/class9-ch06-ncert-final-browser.cjs
          node --check tests/class9-ch08-ncert-final-browser.cjs
          node --check tests/class9-ch12-ncert-depth-browser.cjs
          node --check tests/class9-ch13-ncert-depth-browser.cjs
          node --check tests/class9-ch14-ncert-depth-browser.cjs
          node --check tests/class9-no-filler-notes-browser.cjs
          node --check cbse-class9-science-full-notes.js
          node --check cbse-class9-science-ch02-full-notes.js
          node --check cbse-class9-science-ch02-reader-enhancements.js
          node --check cbse-class9-science-ch03-full-notes.js
          node --check cbse-class9-science-ch03-reader-enhancements.js
          node --check cbse-class9-science-ch04-full-notes.js
          node --check cbse-class9-science-ch04-reader-enhancements.js
          node --check cbse-class9-science-ch05-full-notes.js
          node --check cbse-class9-science-ch05-reader-enhancements.js
          node --check cbse-class9-science-ch06-full-notes.js
          node --check cbse-class9-science-ch06-reader-enhancements.js
          node --check cbse-class9-science-ch07-full-notes.js
          node --check cbse-class9-science-ch07-reader-enhancements.js
          node --check cbse-class9-science-ch08-full-notes.js
          node --check cbse-class9-science-ch08-reader-enhancements.js
          node --check cbse-class9-science-ch09-full-notes.js
          node --check cbse-class9-science-ch09-reader-enhancements.js
          node --check cbse-class9-science-ch10-full-notes.js
          node --check cbse-class9-science-ch10-reader-enhancements.js
          node --check cbse-class9-science-ch11-full-notes.js
          node --check cbse-class9-science-ch11-reader-enhancements.js
          node --check cbse-class9-science-ch12-full-notes.js
          node --check cbse-class9-science-ch12-reader-enhancements.js
          node --check cbse-class9-science-ch13-full-notes.js
          node --check cbse-class9-science-ch13-reader-enhancements.js
          node --check tests/class9-science-ch01-ncert-depth-browser.cjs
          node --check tests/class9-science-ch02-ncert-depth-browser.cjs
          node --check tests/class9-science-ch03-ncert-depth-browser.cjs
          node --check tests/class9-science-ch04-ncert-depth-browser.cjs
          node --check tests/class9-science-ch05-ncert-depth-browser.cjs
          node --check tests/class9-science-ch06-ncert-depth-browser.cjs
          node --check tests/class9-science-ch07-ncert-depth-browser.cjs
          node --check tests/class9-science-ch08-ncert-depth-browser.cjs
          node --check tests/class9-science-ch09-ncert-depth-browser.cjs
          node --check tests/class9-science-ch10-ncert-depth-browser.cjs
          node --check tests/class9-science-ch11-ncert-depth-browser.cjs
          node --check tests/class9-science-ch12-ncert-depth-browser.cjs
          node --check tests/class9-science-ch13-ncert-depth-browser.cjs
          node --check tests/study-page-visible-browser.cjs
      - name: CBSE NCERT curriculum regression
        run: node tests/cbse-curriculum.cjs
      - name: CAIE AS Physics deep-note regression
        run: node tests/caie-as-physics.cjs
      - name: CAIE AS Chemistry deep-note regression
        run: node tests/caie-as-chemistry.cjs
      - name: CAIE AS Mathematics deep-note regression
        run: node tests/caie-as-mathematics.cjs
      - name: CAIE A Level Physics deep-note regression
        run: node tests/caie-a-level-physics.cjs
      - name: CAIE A Level Chemistry deep-note regression
        run: node tests/caie-a-level-chemistry.cjs
      - name: CAIE A Level Mathematics deep-note regression
        run: node tests/caie-a-level-mathematics.cjs


  curriculum-browser:
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 10
    env:
      SECRET_KEY: local-ci-placeholder-key
      FLASK_DEBUG: "0"
      COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Study page visibility with long saved lesson
        run: node tests/study-page-visible-browser.cjs
      - name: Class 9 chapter topic-page pilot
        run: node tests/class9-math-topic-browser.cjs
      - name: Class 9 checkable lessons and progress rings
        run: node tests/class9-lesson-progress-browser.cjs
      - name: Science Class 9 Maths-style subtopic navigation and saved checklist regression
        run: node tests/class9-science-checklist-parity-browser.cjs
      - name: Kaveri Class 9 English Unit 1 full lesson and checklist regression
        run: node tests/class9-english-kaveri-unit01-browser.cjs
      - name: Previously audited chapters 5–11 stay readable and trackable
        run: node tests/class9-audited-depth-merged-browser.cjs
      - name: Chapter 1 NCERT final notes and progress regression
        run: node tests/class9-ch01-ncert-final-browser.cjs
      - name: Chapter 2 NCERT final notes and progress regression
        run: node tests/class9-ch02-ncert-final-browser.cjs
      - name: Chapter 3 NCERT final notes and progress regression
        run: node tests/class9-ch03-ncert-final-browser.cjs
      - name: Chapter 4 NCERT final notes and progress regression
        run: node tests/class9-ch04-ncert-final-browser.cjs
      - name: Chapter 6 NCERT final notes and progress regression
        run: node tests/class9-ch06-ncert-final-browser.cjs
      - name: Chapter 8 NCERT recurrence and progress regression
        run: node tests/class9-ch08-ncert-final-browser.cjs
      - name: Chapter 12 NCERT proofs and reader regression
        run: node tests/class9-ch12-ncert-depth-browser.cjs
      - name: Chapter 13 NCERT systems and progress regression
        run: node tests/class9-ch13-ncert-depth-browser.cjs
      - name: Chapter 14 NCERT solids and progress regression
        run: node tests/class9-ch14-ncert-depth-browser.cjs
      - name: Class 9 notes without generic filler sections
        run: node tests/class9-no-filler-notes-browser.cjs
      - name: Class 9 Science Chapter 1 NCERT reader regression
        run: node tests/class9-science-ch01-ncert-depth-browser.cjs
      - name: Class 9 Science Chapter 2 NCERT depth and figure regression
        run: node tests/class9-science-ch02-ncert-depth-browser.cjs
      - name: Class 9 Science Chapter 3 NCERT depth and figure regression
        run: node tests/class9-science-ch03-ncert-depth-browser.cjs
      - name: Class 9 Science Chapter 4 NCERT motion and diagram regression
        run: node tests/class9-science-ch04-ncert-depth-browser.cjs
      - name: Class 9 Science Chapter 5 NCERT mixtures and concentration regression
        run: node tests/class9-science-ch05-ncert-depth-browser.cjs
      - name: Verify NCERT Class 9 Science Chapter 6 depth and regression
        run: node tests/class9-science-ch06-ncert-depth-browser.cjs
      - name: Class 9 Science Chapter 7 NCERT teaching and visual regression
        run: node tests/class9-science-ch07-ncert-depth-browser.cjs
      - name: Grade 9 Science Chapter 8 atomic structure reader regression
        run: node tests/class9-science-ch08-ncert-depth-browser.cjs
      - name: Chapter 9 NCERT chemical bonding and formulas browser regression
        run: node tests/class9-science-ch09-ncert-depth-browser.cjs
      - name: Chapter 10 NCERT sound-wave reader regression
        run: node tests/class9-science-ch10-ncert-depth-browser.cjs
      - name: Chapter 11 NCERT reproduction and science reader regression
        run: node tests/class9-science-ch11-ncert-depth-browser.cjs
      - name: Chapter 12 NCERT biodiversity and taxonomy browser regression
        run: node tests/class9-science-ch12-ncert-depth-browser.cjs
      - name: Chapter 13 complete NCERT Science curriculum browser regression
        run: node tests/class9-science-ch13-ncert-depth-browser.cjs
      - name: Chapter navigation and hover motion
        run: node tests/chapter-navigation-hover-browser.cjs
      - name: Refreshed CBSE browser coverage
        run: node tests/cbse-browser.cjs
      - name: CAIE AS Physics browser coverage
        run: node tests/caie-browser.cjs
      - name: CAIE AS Chemistry browser coverage
        run: node tests/caie-chemistry-browser.cjs
      - name: CAIE AS Mathematics browser coverage
        run: node tests/caie-mathematics-browser.cjs
      - name: CAIE A Level Physics browser coverage
        run: node tests/caie-a-level-physics-browser.cjs
      - name: CAIE A Level Chemistry browser coverage
        run: node tests/caie-a-level-chemistry-browser.cjs
      - name: CAIE A Level Mathematics browser coverage
        run: node tests/caie-a-level-mathematics-browser.cjs
      - name: Content-first notes coverage
        run: node tests/content-first-notes-browser.cjs
      - name: Cambridge full-note and diagram coverage
        run: node tests/cambridge-full-notes-diagrams-browser.cjs

  browser:
    runs-on: ubuntu-latest
    needs: static
    env:
      SECRET_KEY: local-ci-placeholder-key
      FLASK_DEBUG: "0"
      COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Learning integration
        if: ${{ !cancelled() }}
        run: node tests/learning-integration.cjs
      - name: Product experience
        if: ${{ !cancelled() }}
        run: node tests/product-experience.cjs
      - name: Pre-beta browser smoke
        if: ${{ !cancelled() }}
        run: node tests/pre-beta-smoke.cjs
      - name: Course dashboard browser coverage
        if: ${{ !cancelled() }}
        run: node tests/course-dashboard-browser.cjs


  postgres:
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studyai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studyai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/studyai_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/studyai_test
      SECRET_KEY: postgres-ci-placeholder-key-0123456789abcdef
      FLASK_DEBUG: "0"
      COOKIE_SECURE: "0"
      TRUST_PROXY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: PostgreSQL server smoke
        run: python tests/pre-beta-server.py
      - name: SQLite to PostgreSQL migration
        run: python tests/postgres-migration.py
      - name: PostgreSQL connection verifier
        run: python verify_neon_setup.py
